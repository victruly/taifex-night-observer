name: 台指期夜盤與外資劇本每日自動觀測發報

on:
  schedule:
    # 每日 22:20 UTC (相當於台灣時間次日 06:20 AM)
    - cron: '20 22 * * *'
  workflow_dispatch: # 支援在 GitHub 介面手動點擊觸發

jobs:
  run-daily-observer:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出儲存庫代碼 (Checkout Code)
        uses: actions/checkout@v3

      - name: 設定 Python 環境 (Setup Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝依賴套件 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 執行夜盤指數觀測與劇本分析發報 (Run Daily Observer)
        env:
          SMTP_SERVER: "smtp.gmail.com"
          SMTP_PORT: 587
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python main.py
